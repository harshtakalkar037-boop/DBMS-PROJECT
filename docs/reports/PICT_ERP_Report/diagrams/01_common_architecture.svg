<svg xmlns="http://www.w3.org/2000/svg" width="600" height="655" viewBox="0 0 600 655"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#53677c"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="300.0" y="25" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" fill="#172a3b"><tspan x="300.0" dy="0">Common application architecture (source-derived)</tspan></text><rect x="30" y="62" width="540" height="80" rx="7" fill="#edf2f7" stroke="#2b455c" /><text x="300.0" y="97.58" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" fill="#172a3b"><tspan x="300.0" dy="0">React 18 / TypeScript / Vite 5 browser SPA</tspan><tspan x="300.0" dy="19.040000000000003">Frontend pages and API client</tspan></text><line x1="300" y1="143" x2="300" y2="187" stroke="#53677c" stroke-width="1.2" marker-end="url(#a)"/><text x="300.0" y="166" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="13.5" font-weight="normal" fill="#172a3b"><tspan x="300.0" dy="0">HTTP JSON / errors</tspan></text><rect x="30" y="188" width="540" height="80" rx="7" fill="#edf2f7" stroke="#2b455c" /><text x="300.0" y="223.57999999999998" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" fill="#172a3b"><tspan x="300.0" dy="0">Express 4 /api/v1</tspan><tspan x="300.0" dy="19.040000000000003">Authenticate → requireRole → validate → controller</tspan></text><line x1="300" y1="269" x2="300" y2="313" stroke="#53677c" stroke-width="1.2" marker-end="url(#a)"/><text x="300.0" y="292" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="13.5" font-weight="normal" fill="#172a3b"><tspan x="300.0" dy="0">application operations</tspan></text><rect x="30" y="314" width="540" height="80" rx="7" fi