<svg xmlns="http://www.w3.org/2000/svg" width="600" height="680" viewBox="0 0 600 680"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#53677c"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="300.0" y="25" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" fill="#172a3b"><tspan x="300.0" dy="0">sp_register_student_for_exam — workflow supplement</tspan></text><rect x="30" y="58" width="540" height="70" rx="7" fill="#edf2f7" stroke="#2b455c" /><text x="300.0" y="97.8" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" fill="#172a3b"><tspan x="300.0" dy="0">1. Load examination state and reject duplicate registration</tspan></text><line x1="300" y1="129" x2="300" y2="155" stroke="#53677c" stroke-width="1.2" marker-end="url(#a)"/><rect x="30" y="156" width="540" height="70" rx="7" fill="#edf2f7" stroke="#2b455c" /><text x="300.0" y="195.8" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" fill="#172a3b"><tspan x="300.0" dy="0">2. Start transaction; calculate attendance and outstanding dues</tspan></text><line x1="300" y1="227" x2="300" y2="253" stroke="#53677c" stroke-width="1.2" marker-end="url(#a)"/><rect x="30" y="254" width="540" height="70" rx="7" fill="#edf2f7" stroke="#2b455c" /><text x="300.0" y="293.8" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" fill="#172a3b"><tspan x="300.0" dy="0">3. Compute dues without applying a dues-based rejection</tspan></text><line x1="300" y1="325" x2="300" y2="351" stroke="#53677c" stroke-width="1.2" marker-end="url(#a)"/><rect x="30" y="352" width="540" height="70" rx="7" fill="#edf2f7" stroke="#2b455c" /><text x="300.0" y="391.8" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" fill="#172a3b"><tspan x="300.0" dy="0">4. For low attendance return REJECTED and rollback</tspan></text><line x1="300" y1="423" x2="300" y2="449" stroke="#53677c" stroke-width="1.2" marker-end="url(#a)"/><rect x="30" y="450" width="540" height="70" rx="7" fill="#edf2f7" stroke="#2b455c" /><text x="300.0" y="480.84000000000003" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" fill="#172a3b"><tspan x="300.0" dy="0">5. Insert eligible registration and hall ticket; insert trigger</tspan><tspan x="300.0" dy="17.92">also checks global threshold</tspan></text><line x1="300" y1="521" x2="300" y2="547" stroke="#53677c" stroke-width="1.2" marker-end="url(#a)"/><rect x="30" y="548" width="540" height="70" rx="7" fill="#edf2f7" stroke="#2b455c" /><text x="300.0" y="578.8399999999999" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" fill="#172a3b"><tspan x="300.0" dy="0">6. Write audit / notification; commit, or rollback on SQL</tspan><tspan x="300.0" dy="17.92">exception</tspan></text><text x="300" y="664" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="12.5" font-weight="normal" fill="#172a3b"><tspan x="300" dy="0">Sequence/exception explanation, not a second canonical DFD. See exact SQL for branches.</tspan></text></svg>